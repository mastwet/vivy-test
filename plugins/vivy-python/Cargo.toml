[package]
name = "vivy-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
rig-harness = { git = "https://github.com/0xPlaygrounds/rig", rev = "55cd481a2421fd5da468b5bd6afc6ac876883599" }
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vivy-process = { path = "../../crates/vivy-process" }

[dev-dependencies]
futures = "0.3"
