[package]
name = "vivy-gateway"
version = "0.1.0"
description = "A rig-harness plugin: the models of one OpenAI-compatible gateway, from settings.toml's [gateway]."
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
# Must be the recipe's Rig revision: the agent holds one copy of each Rig crate.
rig-harness = { git = "https://github.com/0xPlaygrounds/rig", rev = "55cd481a2421fd5da468b5bd6afc6ac876883599" }
# Named by the Resource derive and the log macros; Rig's exact versions.
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_log = "=0.20.0"
serde = { version = "1", features = ["derive"] }
