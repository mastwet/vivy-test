[package]
name = "vivy-basics"
version = "0.1.0"
description = "rig-harness plugins for daily use, after Pi: search tools, prompt templates, /session, /copy and /export."
edition = "2024"
rust-version = "1.97.1"
publish = false

[features]
# /copy through the terminal view (OSC 52 as well as the system clipboard).
tui = ["dep:rig-tui"]

[dependencies]
# Must be the recipe's Rig revision: the agent holds one copy of each Rig crate.
rig-harness = { git = "https://github.com/0xPlaygrounds/rig", rev = "55cd481a2421fd5da468b5bd6afc6ac876883599" }
rig-tui = { git = "https://github.com/0xPlaygrounds/rig", rev = "55cd481a2421fd5da468b5bd6afc6ac876883599", optional = true, default-features = false }
# Named by the derives and the log macros; Rig's exact versions.
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_log = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A template's frontmatter.
serde-saphyr = "2"
