[package]
name = "vivy"
version = "0.1.0"
description = "Builds vivy-test agents from YAML recipes with generated Cargo dependencies and static plugin wiring."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
rig-harness-protocol = { git = "https://github.com/0xPlaygrounds/rig", rev = "55cd481a2421fd5da468b5bd6afc6ac876883599" }
ctrlc = "3"
